services:
  postgres: # service name
    image: postgres:16-alpine
    container_name: halyard_postgres
    restart: always
    environment:
      POSTGRES_USER: halyard_user
      POSTGRES_PASSWORD: halyard_password
      POSTGRES_DB: halyard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halyard_user -d halyard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: halyard_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://halyard_user:halyard_password@postgres:5432/halyard_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:Z
      - /app/.venv
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
