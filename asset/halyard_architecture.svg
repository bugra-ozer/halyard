<svg viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif">
  <title>Halyard architecture</title>
  <desc>Two request paths meet at PostgreSQL. Admin path: Admin UI (JS) goes through JWT Auth to /flags (CRUD) and /rules (Builder), which both feed the SSE Broadcaster that pushes live updates. JWT Auth reads users, /rules reads and writes rules, /flags reads and writes feature_flags. SDK path: Client SDK goes through Key Hash to /evaluate and the Evaluator (SHA-256 plus rules), which returns True or False. Key Hash checks api_keys; the Evaluator reads rules and feature_flags. PostgreSQL holds users, api_keys, rules and feature_flags; rules.flag_id references feature_flags.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a9a79c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ database links (drawn first, so nodes sit on top) ============ -->
  <g fill="none" stroke="#a9a79c" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#arrow-grey)">
    <!-- JWT Auth -> users -->
    <path d="M300,163 V346" />
    <!-- /rules -> rules -->
    <path d="M530,223 V262 H865 V346" />
    <!-- /flags -> feature_flags (clear route over the lane, nothing crossed) -->
    <path d="M530,57 V30 H1195 V346" />
    <!-- Key Hash -> api_keys -->
    <path d="M520,557 V442" />
    <!-- Evaluator -> rules -->
    <path d="M880,557 V442" />
    <!-- Evaluator -> feature_flags -->
    <path d="M940,557 V500 H1195 V442" />
  </g>

  <!-- ============ admin path (top lane) ============ -->
  <g fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round">
    <line x1="190" y1="140" x2="240" y2="140" marker-end="url(#arrow-blue)"/>
    <line x1="360" y1="140" x2="400" y2="140"/>
    <path d="M400,80 V200"/>
    <line x1="400" y1="80" x2="440" y2="80" marker-end="url(#arrow-blue)"/>
    <line x1="400" y1="200" x2="440" y2="200" marker-end="url(#arrow-blue)"/>
    <path d="M620,80 H665 V200 H620"/>
    <line x1="665" y1="140" x2="715" y2="140" marker-end="url(#arrow-blue)"/>
    <line x1="915" y1="140" x2="965" y2="140" marker-end="url(#arrow-blue)"/>
  </g>
  <circle cx="400" cy="140" r="3" fill="#93c5fd"/>
  <circle cx="665" cy="140" r="3" fill="#93c5fd"/>

  <g fill="rgba(147,197,253,0.06)" stroke="#93c5fd" stroke-width="1.2">
    <rect x="40"  y="117" width="150" height="46" rx="8"/>
    <rect x="240" y="117" width="120" height="46" rx="8"/>
    <rect x="440" y="57"  width="180" height="46" rx="8"/>
    <rect x="440" y="177" width="180" height="46" rx="8"/>
    <rect x="715" y="117" width="200" height="46" rx="8" fill="rgba(147,197,253,0.16)" stroke-width="1.8"/>
    <rect x="965" y="117" width="140" height="46" rx="8"/>
  </g>
  <g font-size="18" fill="rgb(250,249,245)" text-anchor="middle">
    <text x="115"  y="146">Admin UI (JS)</text>
    <text x="300"  y="146">JWT Auth</text>
    <text x="530"  y="86">/flags (CRUD)</text>
    <text x="530"  y="206">/rules (Builder)</text>
    <text x="815"  y="146" font-weight="bold" fill="#93c5fd">SSE Broadcaster</text>
    <text x="1035" y="146">Live Push</text>
  </g>

  <!-- ============ database group ============ -->
  <rect x="20" y="296" width="1360" height="176" rx="8" fill="none" stroke="rgba(222,220,209,0.4)" stroke-width="1" stroke-dasharray="4 3"/>
  <g transform="translate(38, 306)" stroke="rgb(250,249,245)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"/>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
  </g>
  <text x="72" y="324" font-size="17" fill="rgb(250,249,245)">PostgreSQL</text>

  <!-- tables: x = 60, 390, 720, 1050 (290 wide, 40 gap) -->
  <g fill="#161b22" stroke="rgba(222,220,209,0.5)" stroke-width="1">
    <rect x="60"   y="346" width="290" height="96" rx="6"/>
    <rect x="390"  y="346" width="290" height="96" rx="6"/>
    <rect x="720"  y="346" width="290" height="96" rx="6"/>
    <rect x="1050" y="346" width="290" height="96" rx="6"/>
  </g>
  <g stroke="rgba(222,220,209,0.35)" stroke-width="1">
    <line x1="80"   y1="389" x2="330"  y2="389"/>
    <line x1="410"  y1="389" x2="660"  y2="389"/>
    <line x1="740"  y1="389" x2="990"  y2="389"/>
    <line x1="1070" y1="389" x2="1320" y2="389"/>
  </g>
  <g font-size="19" font-weight="500" fill="rgb(250,249,245)">
    <text x="80"   y="377">USERS</text>
    <text x="410"  y="377">API_KEYS</text>
    <text x="740"  y="377">RULES</text>
    <text x="1070" y="377">FEATURE_FLAGS</text>
  </g>
  <g font-size="15" fill="rgb(194,192,182)">
    <text x="80"   y="418">id, email, password_hash</text>
    <text x="410"  y="418">id, key_hash, env (dev/prod)</text>
    <text x="740"  y="418">id, flag_id, attr, op</text>
    <text x="1070" y="418">id, key, enabled, %</text>
  </g>
  <!-- foreign key: rules.flag_id -> feature_flags.id -->
  <line x1="1010" y1="413" x2="1050" y2="413" stroke="#a9a79c" stroke-width="1.2" marker-end="url(#arrow-grey)"/>
  <text x="1030" y="405" font-size="11" fill="rgb(194,192,182)" text-anchor="middle">FK</text>

  <!-- ============ sdk path (bottom lane) ============ -->
  <g fill="none" stroke="#5eead4" stroke-width="1.5">
    <line x1="400" y1="580" x2="450"  y2="580" marker-end="url(#arrow-teal)"/>
    <line x1="590" y1="580" x2="640"  y2="580" marker-end="url(#arrow-teal)"/>
    <line x1="780" y1="580" x2="830"  y2="580" marker-end="url(#arrow-teal)"/>
    <line x1="970" y1="580" x2="1150" y2="580" marker-end="url(#arrow-teal)"/>
  </g>
  <g fill="rgba(94,234,212,0.06)" stroke="#5eead4" stroke-width="1.2">
    <rect x="260"  y="557" width="140" height="46" rx="8"/>
    <rect x="450"  y="557" width="140" height="46" rx="8"/>
    <rect x="640"  y="557" width="140" height="46" rx="8"/>
    <rect x="830"  y="557" width="140" height="46" rx="8" fill="rgba(94,234,212,0.16)" stroke-width="1.8"/>
    <rect x="1150" y="557" width="140" height="46" rx="8"/>
  </g>
  <g font-size="18" fill="rgb(250,249,245)" text-anchor="middle">
    <text x="330"  y="586">Client SDK</text>
    <text x="520"  y="586">Key Hash</text>
    <text x="710"  y="586">/evaluate</text>
    <text x="900"  y="586" font-weight="bold" fill="#5eead4">Evaluator</text>
    <text x="1220" y="586">True/False</text>
  </g>
  <text x="1060" y="568" font-size="14" fill="rgb(194,192,182)" text-anchor="middle">(SHA-256 + Rules)</text>

  <!-- ============ key ============ -->
  <g font-size="14" fill="rgb(194,192,182)">
    <line x1="40" y1="548" x2="70" y2="548" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="82" y="553">Admin path</text>
    <line x1="40" y1="572" x2="70" y2="572" stroke="#5eead4" stroke-width="1.5"/>
    <text x="82" y="577">SDK path</text>
    <line x1="40" y1="596" x2="70" y2="596" stroke="#a9a79c" stroke-width="1.2"/>
    <text x="82" y="601">Database access</text>
  </g>
</svg>